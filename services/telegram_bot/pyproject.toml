[project]
name = "shifohalqa-telegram"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram==3.31.0",
    "aiohttp>=3.13,<3.15",
    "psycopg[binary,pool]>=3.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
